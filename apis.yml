aid: adapter
name: Adapter
description: 'Adapter is a cognition API — a persistent memory and knowledge-graph layer that sits alongside
  AI models so understanding is already available when agents need answers. Founded by Adam Ghetti and
  David Bader, Adapter continuously reads and connects a user''s data (calendar, contacts, messages, email,
  conversations) into a living knowledge graph, grounding every response in cited sources and surfacing
  hidden connections across sources rather than starting each query from scratch. The Adapter API exposes
  multi-model conversation/completion endpoints, knowledge-graph and memory queries, life-radar events,
  reminders, multi-channel messaging, reranking, and an OAuth 2.0 + hosted MCP surface (mcp:read) for
  agent access. Tagline: "Give your model a mind."'
