overlay: 1.0.0
info:
  title: API Evangelist enhancements for Adapter API
  version: 1.0.0
extends: openapi/adapter-openapi.json
actions:
- target: $.info
  update:
    description: >-
      Adapter is a cognition API that gives AI models and agents persistent memory and a
      continuously-updated knowledge graph over connected data sources, returning
      evidence-based, cited answers. This document is the Adapter Life consumer harness.
    x-apievangelist-provider: adapter
    x-apievangelist-product: Adapter Life
- target: $.info
  update:
    x-agentic-access-profile: agentic-access/adapter-agentic-access.yml
- target: $
  update:
    servers:
    - url: https://api.adapter.com/v1
      description: Production
- target: $.components.securitySchemes
  update:
    OAuth2:
      type: oauth2
      description: Adapter OAuth 2.0 authorization server (authorization_code + PKCE) for external app/agent + MCP access.
      flows:
        authorizationCode:
          authorizationUrl: https://api.adapter.com/v1/oauth2/authorize
          tokenUrl: https://api.adapter.com/v1/oauth2/token
          scopes:
            mcp:read: Read access to the Adapter hosted MCP server.
            offline_access: Issue a refresh token for long-lived agent access.
