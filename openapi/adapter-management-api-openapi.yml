openapi: 3.1.0
info:
  title: Adapter Adapter API management API
  version: 0.1.0
tags:
- name: management
paths:
  /management/sessions/kill:
    post:
      tags:
      - management
      summary: Kill User Sessions
      description: 'Invalidate all sessions for a user.


        Called by Auth0 Actions on password change (M2M JWT auth).

        Sets a user-scoped denylist timestamp — any access token with iat before

        this timestamp will be rejected by the shared auth dependency.'
      operationId: kill_user_sessions_management_sessions_kill_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KillSessionsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    KillSessionsRequest:
      properties:
        userId:
          type: string
          title: Userid
      type: object
      required:
      - userId
      title: KillSessionsRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
    HTTPBearer:
      type: http
      scheme: bearer
