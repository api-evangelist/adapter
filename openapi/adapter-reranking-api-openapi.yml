openapi: 3.2.0
info:
  title: Adapter Reranking API
  version: 0.1.0
tags:
- name: Reranking
paths:
  /users/me/reranking:
    post:
      tags:
      - Reranking
      summary: Reranking
      operationId: reranking_users_me_reranking_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RerankingRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RerankingResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RankedOption:
      properties:
        option:
          title: Option
        score:
          type: number
          title: Score
        reasoning:
          anyOf:
          - type: string
          - type: 'null'
          title: Reasoning
      type: object
      required:
      - option
      - score
      title: RankedOption
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    RerankingResponse:
      properties:
        options:
          items:
            $ref: '#/components/schemas/RankedOption'
          type: array
          title: Options
      type: object
      required:
      - options
      title: RerankingResponse
    RerankingRequest:
      properties:
        options:
          items: {}
          type: array
          title: Options
        context:
          type: string
          title: Context
        reasoning:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Reasoning
          default: false
      type: object
      required:
      - options
      - context
      title: RerankingRequest
  securitySchemes:
    HTTPBasic:
      type: http
      scheme: basic
    HTTPBearer:
      type: http
      scheme: bearer
